name: Results don't match
description: Scores you get from RCAEval differ from a paper, the README or an earlier release.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        RCAEval is a benchmark, so we take result mismatches seriously. The more precisely you describe your run, the faster we can find the cause.
  - type: input
    id: method
    attributes:
      label: Method
      placeholder: baro
    validations:
      required: true
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset
      options:
        - re1-ob
        - re1-ss
        - re1-tt
        - re2-ob
        - re2-ss
        - re2-tt
        - re3-ob
        - re3-ss
        - re3-tt
        - online-boutique / sock-shop-1 / sock-shop-2 / train-ticket
        - torai-ob / torai-ss / torai-tt
        - eventadl-falcon / eventadl-flask / eventadl-live
        - other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command, with every flag.
      placeholder: python main.py --method baro --dataset re2-tt --length 20
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected results and where they come from
      description: The numbers you expected, and the source (paper and table, README section, or the release you ran before).
      placeholder: Table 6 of the RCAEval paper (WWW'25), Train Ticket row
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Your results
      description: Paste the full `--- Evaluation results ---` block.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: RCAEval version or branch, Python version and OS
      description: Paper results are frozen on the `ase24`, `www25` and `fse26` branches. Say which branch or release you ran.
      placeholder: main at ec344b1, Python 3.14.0, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Changes you made to the code or data, how many runs you averaged, GPU or CPU, etc.
