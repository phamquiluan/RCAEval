name: Build and test

on:
  push:
    branches: [ "main", "dev", "v2"]
  pull_request:
    branches: [ "main", "dev", "v2"]
  workflow_dispatch:

jobs:
  build-and-test-default:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y build-essential libxml2 libxml2-dev zlib1g-dev python3-tk graphviz libjpeg-dev zlib1g-dev
        # CPU-only torch: skips about 5 GB of CUDA wheels
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install .[default]

    - name: Verify installed package outside checkout
      working-directory: /tmp
      run: python "$GITHUB_WORKSPACE/script/check_installed_package.py"

    - name: Test
      run: python -m pytest tests/test_parser* tests/test_evaluator.py tests/test_agent.py tests/test_agent_toolkit.py tests/test_agent_react.py tests/test_graph_methods.py tests/test_sli.py tests/test_version_gates.py

    - name: Test the converters (convert extra)
      run: |
        python -m pip install .[convert]
        python -m pytest tests/test_convert.py

    - name: Test the MCP server and agent runner (agent extra)
      if: matrix.python-version == '3.14'
      run: |
        python -m pip install .[agent]
        python -m pytest tests/test_agent_mcp.py

    - name: Optional network integration tests
      if: github.event_name == 'workflow_dispatch'
      run: python -m pytest tests/test.py

  build-and-test-rcd:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.8"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y build-essential libxml2 libxml2-dev zlib1g-dev python3-tk graphviz libjpeg-dev zlib1g-dev
        python -m venv env-rcd
        . env-rcd/bin/activate
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install pytest
        python -m pip install .[rcd]

        bash script/link.sh

    - name: Verify installed package outside checkout
      working-directory: /tmp
      run: |
        . "$GITHUB_WORKSPACE/env-rcd/bin/activate"
        python "$GITHUB_WORKSPACE/script/check_installed_package.py"

    - name: Install PyRCA integration dependencies
      if: github.event_name == 'workflow_dispatch'
      run: |
        . "$GITHUB_WORKSPACE/env-rcd/bin/activate"
        sudo apt install -y openjdk-11-jre-headless
        git clone https://github.com/salesforce/PyRCA.git
        cd PyRCA
        python -m pip install "JPype1<1.5"
        python -m pip install -e .

    - name: Optional RCD network integration tests
      if: github.event_name == 'workflow_dispatch'
      run: |
        . env-rcd/bin/activate
        python -m pytest tests/test_rcd.py
